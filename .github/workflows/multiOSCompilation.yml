name: CI-MultiOS

on:
  push:
    branches: 
      - '*'
    tags:
      - v*
  pull_request:
  repository_dispatch:
    types: [run_build]

jobs:
  build:
    runs-on: ${{ matrix.os[0] }}
    strategy:
      matrix:
        os: [
          [macos-latest, arm64, bash],
          [macos-13, x86_64, bash],
          [ubuntu-latest, x86_64, bash],
          [windows-latest, x86_64, msys2]
        ]
      fail-fast: false
    defaults:
     run:
      shell: ${{ matrix.os[2] }} {0}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Ubuntu packages
        if: matrix.os[0] == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get -y install curl make bash autoconf automake libgmp3-dev libmpfr-dev libmpc-dev liblzf-dev

      - name: Install macOS packages
        if: startsWith(matrix.os[0], 'macos')
        run: |
          brew update
          brew install curl make bash autoconf automake gsl gmp mpfr libmpc liblzf

      - name: Install MSYS2 packages
        if: matrix.os[0] == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          install: |
            base-devel git mingw-w64-i686-gcc tar zip mingw-w64-i686-cmake mingw-w64-i686-make
          update: true
    
      - name: Download precompiled ps2dev toolchain from ps2dev/ps2dev
        run: |
          curl -sL https://github.com/ps2dev/ps2dev/releases/download/latest/ps2dev-${{ matrix.os[0] }}.tar.gz | tar xvz -C ./

      - name: Compile project
        run: |
          export PS2DEV=$PWD/ps2dev
          export PS2SDK=$PS2DEV/ps2sdk
          export GSKIT=$PS2DEV/gsKit
          export PATH=$PATH:$PS2DEV/bin:$PS2DEV/ee/bin:$PS2DEV/iop/bin:$PS2DEV/dvp/bin:$PS2SDK/bin

          # Download and compile ps2-packer as it is not working fine with precompiled binaries
          git clone --depth 1 https://github.com/ps2dev/ps2-packer && cd ps2-packer && make install && cd .. && rm -rf ps2-packer
          
          make -j $(getconf _NPROCESSORS_ONLN) clean 
          make -j $(getconf _NPROCESSORS_ONLN)

      - name: Get short SHA
        id: slug
        run: |
          printf '%s\n' "sha8=$(printf '%s\n' ${GITHUB_SHA} | cut -c1-8)" >> $GITHUB_OUTPUT

      - name: Extract tag name
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "DOCKER_TAG=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV

      - name: Compress & Rename bin folder
        run: |
          mv bin/ ps2link/
          mv contrib/icon.sys ps2link/icon.sys
          mv contrib/PS2LINK.icn ps2link/PS2LINK.icn
          tar -zcvf ps2link-${{ steps.slug.outputs.sha8 }}-${{ matrix.version[0] }}.tar.gz ps2link

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps2link-${{ steps.slug.outputs.sha8 }}-${{ matrix.os[0] }}-${{ matrix.os[1] }}
          path: ps2link-${{ steps.slug.outputs.sha8 }}-${{ matrix.os[0] }}-${{ matrix.os[1] }}.tar.gz

      - name: Upload uncompressd artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ps2link-uncompressed-${{ steps.slug.outputs.sha8 }}-${{ matrix.os[0] }}-${{ matrix.os[1] }}
          path: ee/ps2link.elf